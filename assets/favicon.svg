<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="diceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102643"/>
      <stop offset="100%" stop-color="#091122"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="44" height="44" rx="10" fill="url(#diceGrad)" filter="url(#shadow)"/>
  <!-- 5 dots layout -->
  <circle cx="21" cy="21" r="3.5" fill="#1e293b"/>
  <circle cx="43" cy="21" r="3.5" fill="#1e293b"/>
  <circle cx="32" cy="32" r="3.5" fill="#e11d48"/>
  <circle cx="21" cy="43" r="3.5" fill="#1e293b"/>
  <circle cx="43" cy="43" r="3.5" fill="#1e293b"/>
</svg>